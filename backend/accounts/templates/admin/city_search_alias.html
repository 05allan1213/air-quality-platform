{% extends "admin/base_site.html" %}

{% block content %}
<main>
  <h1>城市检索别名</h1>
  <p><a href="{% url 'admin:city_search_alias_directory' %}">返回城市目录</a></p>
  <dl>
    <dt>产品</dt><dd>{{ product_id }}</dd>
    <dt>城市</dt><dd>{{ city_name }}</dd>
    <dt>行政区划</dt><dd>{{ geography }}</dd>
    <dt>版本</dt><dd>{{ version }}</dd>
  </dl>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="set">
    <input type="hidden" name="reason_code" value="search_correction">
    <input type="hidden" name="expected_version" value="{{ version }}">
    <input type="hidden" name="request_id" value="{{ set_request_id }}">
    <label for="search-alias">检索别名</label>
    <input id="search-alias" name="search_alias" value="{{ search_alias }}" maxlength="32" required>
    <button type="submit">保存</button>
  </form>
  {% if search_alias %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="clear">
    <input type="hidden" name="reason_code" value="search_correction">
    <input type="hidden" name="expected_version" value="{{ version }}">
    <input type="hidden" name="request_id" value="{{ clear_request_id }}">
    <input type="hidden" name="search_alias" value="">
    <button type="submit">清除别名</button>
  </form>
  {% endif %}
</main>
{% endblock %}
