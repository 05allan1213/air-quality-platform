# TLS passthrough: the Worker verifies the origin certificate. No TLS keys or HTTP logs here.
global
    maxconn 16

defaults
    mode tcp
    timeout connect 2s
    timeout client 15s
    timeout server 15s

resolvers docker
    nameserver engine 127.0.0.11:53
    resolve_retries 1
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend from_worker
    bind cnemc-worker-listener:18007
    tcp-request inspect-delay 2s
    tcp-request content reject unless { req.ssl_hello_type 1 } { req.ssl_sni -i air.cnemc.cn }
    # Resolve only after an allowed ClientHello. Never use a client-supplied destination.
    tcp-request content do-resolve(txn.origin,docker,ipv4) str(air.cnemc.cn)
    tcp-request content reject unless { var(txn.origin) -m found }
    tcp-request content set-dst var(txn.origin)
    default_backend cnemc

backend cnemc
    server origin 0.0.0.0:18007
