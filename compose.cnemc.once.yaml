# First A03 acceptance only. Apply AFTER compose.yaml and compose.cnemc.yaml.
name: cnemc-a03-once
x-limited: &limited
  CNEMC_MODE: limited

services:
  web:
    environment: *limited
  worker-cnemc:
    environment: *limited
  migrate:
    environment:
      CNEMC_MODE: 'off'
  beat:
    scale: 0
    environment:
      CNEMC_MODE: 'off'
